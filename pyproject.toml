[tool.poetry]
name = "opinionated-structlog-config"
version = "0.3.0"
description = ""
authors = ["Joel Ryan <joel@iwcenter.com>"]
readme = "README.md"
repository = "https://github.com/joelryan2k/opinionated-structlog-config"

[tool.poetry.dependencies]
python = "^3.8"
structlog = "^24.1.0"
django-structlog = { version = "^8.0.0", optional = true}
structlog-sentry = { version = "^2.1.0", optional = true}
sentry-sdk = { version = "^2.10.0", optional = true}
celery = { version = "^5.3.0", optional = true}

[tool.poetry.extras]
django = ["django-structlog"]
sentry = ["structlog-sentry", "sentry-sdk"]
celery = ["celery", "django-structlog"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"
django-structlog = "^8.0.0"
structlog-sentry = "^2.1.0"
sentry-sdk = "^2.10.0"
celery = "^5.3.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
